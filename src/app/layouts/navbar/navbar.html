<!-- Navbar horizontal arriba -->
<header class="top-navbar">
  <button mat-icon-button (click)="openSidenav()" type="button">
    <mat-icon>menu</mat-icon>
  </button>
  
  <div class="navbar-right">
    <!-- Botones cuando NO está logueado -->
    @if (!isAuthenticated) {
      <button mat-button (click)="openLoginModal()" type="button">
        <mat-icon>account_circle</mat-icon>
        Ingresar
      </button>
    }
    
    <!-- Información del usuario cuando está logueado -->
    @if (isAuthenticated && currentUser) {
      <span class="user-info">
        <span class="avatar" aria-hidden="true">
          @if (getUserPhotoUrl()) {
            <img [src]="getUserPhotoUrl()!" [alt]="'Foto de ' + getUserDisplayName()" loading="lazy" />
          } @else {
            <span>{{ getAvatarText() }}</span>
          }
        </span>
        {{ getUserDisplayName() }}
      </span>
      <button mat-button (click)="logout()" type="button" class="logout-btn">
        <mat-icon>logout</mat-icon>
        Salir
      </button>
    }
  </div>
</header>
